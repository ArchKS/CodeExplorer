<!DOCTYPE html>
<!-- ai coding: 扩展单输入框 CAGR 计算器以支持起止年月区间 2026/09/11: 14:11 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收益率计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        /* ai coding: 将艳丽渐变背景改为克制的浅灰蓝，并弱化标题与卡片阴影 2026/09/11: 14:12 */
        body {
            min-height: 100vh;
            padding: 40px 20px;
            background: #eef1f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .page-title {
            margin-bottom: 40px;
            color: #1f2937;
            font-size: 32px;
            text-align: center;
        }

        .calculators-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .calculator-section {
            padding: 40px;
            background: white;
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        .section-title {
            margin-bottom: 10px;
            padding-bottom: 10px;
            color: #333;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .hint {
            margin-top: 5px;
            color: #999;
            font-size: 12px;
            line-height: 1.6;
        }

        /* ai coding: 将按钮改为苹果式光泽跟随、空间倾斜与弹簧回弹交互 2026/09/11: 14:33 */
        button {
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            --pointer-x: 50%;
            --pointer-y: 50%;
            --rotate-x: 0deg;
            --rotate-y: 0deg;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 52px;
            padding: 8px 9px 8px 19px;
            overflow: hidden;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: 0.04em;
            transform: perspective(700px) rotateX(0) rotateY(0) scale(1);
            transform-style: preserve-3d;
            will-change: transform;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            transition:
                transform 420ms cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 420ms cubic-bezier(0.16, 1, 0.3, 1),
                border-color 260ms ease;
        }

        .button-mark {
            position: relative;
            display: grid;
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            place-items: center;
            font-size: 18px;
            line-height: 1;
            transform: translateZ(22px);
            transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1), background 260ms ease;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            color: white;
            background: #000;
            color: #fff;
            background:
                radial-gradient(circle 150px at var(--pointer-x) var(--pointer-y), rgba(255, 255, 255, 0.24), transparent 60%),
                linear-gradient(180deg, #353538 0%, #1d1d1f 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.16) inset,
                0 8px 20px rgba(15, 23, 42, 0.18),
                0 2px 5px rgba(15, 23, 42, 0.12);
        }

        .btn-primary:hover,
        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.3);
        }

        .btn-primary .button-mark {
            color: #fff;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12) inset;
        }

        .btn-primary:hover {
            transform: perspective(700px) rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) translateY(-2px) scale(1.012);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.18) inset,
                0 14px 30px rgba(15, 23, 42, 0.22),
                0 4px 9px rgba(15, 23, 42, 0.12);
        }

        .btn-primary:hover .button-mark {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(3px) translateZ(28px);
        }

        .btn-clear {
            width: 120px;
            height: 40px;
            width: 100%;
            margin-top: 20px;
            color: #fff;
            background: #000;
            color: #3a3a3c;
            background:
                radial-gradient(circle 150px at var(--pointer-x) var(--pointer-y), rgba(255, 255, 255, 0.95), transparent 62%),
                rgba(246, 246, 248, 0.88);
            border: 1px solid rgba(60, 60, 67, 0.12);
            border-radius: 14px;
            box-shadow:
                0 1px 0 #fff inset,
                0 5px 14px rgba(15, 23, 42, 0.07);
            backdrop-filter: blur(14px);
        }

        .btn-clear .button-mark {
            color: #636366;
            background: rgba(120, 120, 128, 0.1);
            border-radius: 50%;
        }

        .btn-clear:hover {
            background: #667eea;
            border-color: rgba(60, 60, 67, 0.18);
            transform: perspective(700px) rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) translateY(-2px) scale(1.012);
            box-shadow:
                0 1px 0 #fff inset,
                0 12px 24px rgba(15, 23, 42, 0.1);
        }

        .btn-clear:hover .button-mark {
            color: #1d1d1f;
            background: rgba(120, 120, 128, 0.14);
            transform: rotate(-22deg) translateZ(24px);
        }

        button:active {
            transform: perspective(700px) scale(0.965);
            transition-duration: 90ms;
            box-shadow: 0 2px 7px rgba(15, 23, 42, 0.12);
        }

        button:focus-visible {
            outline: 3px solid rgba(0, 113, 227, 0.25);
            outline-offset: 4px;
        }

        .result-box,
        .cagr-result {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #f5f7fa;
            border-radius: 12px;
        }

        .result-box.show,
        .cagr-result.show {
            display: block;
            animation: slide-in 0.3s ease-out;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .result-item:last-of-type {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .result-label {
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
            font-weight: 500;
        }

        .result-value {
            color: #333;
            font-size: 24px;
            font-weight: 700;
        }

        .result-value.positive {
            color: #10b981;
        }

        .result-value.negative {
            color: #ef4444;
        }

        .detail-info {
            margin-top: 15px;
            padding-top: 15px;
            color: #666;
            font-size: 13px;
            line-height: 1.7;
            border-top: 1px solid #ddd;
        }

        .error-msg {
            display: none;
            margin-top: 10px;
            color: #ef4444;
            font-size: 14px;
        }

        .error-msg.show {
            display: block;
        }

        /* ai coding: 在系统要求减少动态效果时关闭按钮空间动画 2026/09/11: 14:33 */
        @media (prefers-reduced-motion: reduce) {
            button,
            .button-mark {
                transition-duration: 0.01ms !important;
            }

            button:hover,
            button:active {
                transform: none;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 14px;
            }

            .calculators-wrapper {
                grid-template-columns: 1fr;
            }

            .calculator-section {
                padding: 25px;
            }

            .page-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <h1 class="page-title">收益率计算器</h1>

    <main class="calculators-wrapper">
        <section class="calculator-section">
            <h2 class="section-title">📈 年化数组</h2>
            <p class="subtitle">输入每年的收益率，计算年化收益率和总收益率</p>

            <div class="input-group">
                <label for="returns">年度收益率 (%)</label>
                <input
                    type="text"
                    id="returns"
                    placeholder="0.58, 5.23, 24, 164.8"
                    autocomplete="off"
                    value="0.58,5.23,24,164.8"
                >
                <div class="hint">用逗号分隔每年的收益率，支持负数</div>
            </div>

            <!-- ai coding: 为计算按钮加入文字层与独立箭头徽章 2026/09/11: 14:24 -->
            <button class="btn-primary" id="annual-calculate" type="button">计算</button>
            <button class="btn-primary" id="annual-calculate" type="button">
                <span>计算收益</span>
                <span class="button-mark" aria-hidden="true">↗</span>
            </button>
            <div class="error-msg" id="annual-error"></div>

            <div class="result-box" id="annual-result">
                <div class="result-item">
                    <div class="result-label">年化收益率</div>
                    <div class="result-value" id="annualized-value"></div>
                </div>
                <div class="result-item">
                    <div class="result-label">总收益率</div>
                    <div class="result-value" id="total-value"></div>
                </div>
                <div class="detail-info" id="detail-info"></div>
            </div>
        </section>

        <section class="calculator-section">
            <h2 class="section-title">💰 CAGR</h2>
            <!-- ai coding: 增加四段式起止年月输入说明和示例 2026/09/11: 14:11 -->
            <p class="subtitle">输入两个数计算总收益率；输入年数或起止年月，同时计算年化收益率</p>

            <div class="input-group">
                <label for="cagr-input">起始值、终值、年数或起止年月（可选）</label>
                <input
                    type="text"
                    id="cagr-input"
                    placeholder="例如：10, 20, 2021/6, 2026/1"
                    autocomplete="off"
                >
                <div class="hint">
                    两个数：起始值, 终值<br>
                    三个数：起始值, 终值, 年数<br>
                    四个数：起始值, 终值, 起始年月, 结束年月<br>
                    年月支持 2021.6 或 2021/6 格式
                </div>
            </div>

            <div class="error-msg" id="cagr-error"></div>

            <div class="cagr-result" id="cagr-result">
                <div class="result-item" id="cagr-annual-item">
                    <div class="result-label">年化收益率</div>
                    <div class="result-value" id="cagr-annual-value"></div>
                </div>
                <div class="result-item">
                    <div class="result-label">总收益率</div>
                    <div class="result-value" id="cagr-total-value"></div>
                </div>
                <div class="detail-info" id="cagr-detail-info"></div>
            </div>

            <!-- ai coding: 为清空按钮加入配套文字层与旋转徽章 2026/09/11: 14:24 -->
            <button class="btn-clear" id="cagr-clear" type="button">CLEAR</button>
            <button class="btn-clear" id="cagr-clear" type="button">
                <span>清空输入</span>
                <span class="button-mark" aria-hidden="true">↺</span>
            </button>
        </section>
    </main>

    <script>
        const returnsInput = document.getElementById('returns');
        const annualResultBox = document.getElementById('annual-result');
        const annualError = document.getElementById('annual-error');
        const annualizedValue = document.getElementById('annualized-value');
        const totalValue = document.getElementById('total-value');
        const detailInfo = document.getElementById('detail-info');

        function parseNumberList(value) {
            const parts = value.trim().split(/[，,\s]+/).filter(Boolean);
            const numbers = parts.map(Number);
            return numbers.every(Number.isFinite) ? numbers : null;
        }

        function setReturnColor(element, value) {
            element.className = `result-value ${value >= 0 ? 'positive' : 'negative'}`;
        }

        function showError(element, message) {
            element.textContent = message;
            element.classList.add('show');
        }

        function calculateAnnualReturn() {
            annualResultBox.classList.remove('show');
            annualError.classList.remove('show');

            const returns = parseNumberList(returnsInput.value);
            if (!returns || returns.length === 0) {
                showError(annualError, '请输入有效的年度收益率');
                return;
            }

            const growthMultiple = returns.reduce((total, current) => total * (1 + current / 100), 1);
            if (growthMultiple < 0) {
                showError(annualError, '累计资产为负时无法计算年化收益率');
                return;
            }

            const totalReturn = (growthMultiple - 1) * 100;
            const annualizedReturn = (Math.pow(growthMultiple, 1 / returns.length) - 1) * 100;

            annualizedValue.textContent = `${annualizedReturn.toFixed(2)}%`;
            totalValue.textContent = `${totalReturn.toFixed(2)}%`;
            setReturnColor(annualizedValue, annualizedReturn);
            setReturnColor(totalValue, totalReturn);

            detailInfo.innerHTML = `
                <strong>计算详情：</strong><br>
                投资年限：${returns.length} 年<br>
                各年收益率：${returns.map(value => `${value.toFixed(2)}%`).join(', ')}<br>
                假设初始投资 10,000 元，最终价值：${(10000 * growthMultiple).toFixed(2)} 元
            `;
            annualResultBox.classList.add('show');
        }

        returnsInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') calculateAnnualReturn();
        });
        document.getElementById('annual-calculate').addEventListener('click', calculateAnnualReturn);

        const cagrInput = document.getElementById('cagr-input');
        const cagrResult = document.getElementById('cagr-result');
        const cagrError = document.getElementById('cagr-error');
        const cagrAnnualItem = document.getElementById('cagr-annual-item');
        const cagrAnnualValue = document.getElementById('cagr-annual-value');
        const cagrTotalValue = document.getElementById('cagr-total-value');
        const cagrDetailInfo = document.getElementById('cagr-detail-info');

        // ai coding: 解析两段、三段及带起止年月的四段式 CAGR 输入 2026/09/11: 14:11
        // ai coding: 解析多种 CAGR 输入并将年月差值固定显示一位小数 2026/09/11: 14:15
        function parseYearMonth(value) {
            const match = value.trim().match(/^(\d{4})(?:[./](\d{1,2}))?$/);
            if (!match) return null;

            const year = Number(match[1]);
            const month = match[2] ? Number(match[2]) : 1;
            if (month < 1 || month > 12) return null;

            return {
                year,
                month,
                monthIndex: year * 12 + month - 1,
                label: `${year}年${month}月`
            };
        }

        function parseCagrInput(value) {
            let parts = value.trim().split(/[，,]+/).map(part => part.trim()).filter(Boolean);
            if (parts.length === 1) {
                parts = value.trim().split(/\s+/).filter(Boolean);
            }

            if (![2, 3, 4].includes(parts.length)) return null;

            const start = Number(parts[0]);
            const end = Number(parts[1]);
            if (!Number.isFinite(start) || !Number.isFinite(end)) return null;

            if (parts.length === 2) {
                return { start, end, years: null, periodText: '', inputCount: 2 };
            }

            if (parts.length === 3) {
                const years = Number(parts[2]);
                if (!Number.isFinite(years)) return null;
                return { start, end, years, periodText: `${years} 年`, inputCount: 3 };
            }

            const startDate = parseYearMonth(parts[2]);
            const endDate = parseYearMonth(parts[3]);
            if (!startDate || !endDate) return null;

            const totalMonths = endDate.monthIndex - startDate.monthIndex;
            const years = totalMonths / 12;
            const wholeYears = Math.floor(totalMonths / 12);
            const remainingMonths = totalMonths % 12;
            const durationParts = [];
            if (wholeYears) durationParts.push(`${wholeYears} 年`);
            if (remainingMonths) durationParts.push(`${remainingMonths} 个月`);

            return {
                start,
                end,
                years,
                inputCount: 4,
                periodText: `${startDate.label} 至 ${endDate.label}（${durationParts.join(' ') || '0 个月'}，${years.toFixed(4)} 年）`
            };
        }

        // ai coding: 根据输入数量自动计算总收益率、指定年数或年月区间的年化收益率 2026/09/11: 14:11
        function calculateCAGR() {
            cagrResult.classList.remove('show');
            cagrError.classList.remove('show');

            if (!cagrInput.value.trim()) return;

            const parsed = parseCagrInput(cagrInput.value);
            if (!parsed) {
                showError(cagrError, '请输入 2、3 或 4 段有效内容，例如：10, 20, 2021/6, 2026/1');
                return;
            }

            const { start, end, years, periodText, inputCount } = parsed;
            if (start === 0) {
                showError(cagrError, '起始值不能为 0');
                return;
            }

            const totalReturn = ((end - start) / start) * 100;
            cagrTotalValue.textContent = `${totalReturn.toFixed(2)}%`;
            setReturnColor(cagrTotalValue, totalReturn);

            if (inputCount >= 3) {
                if (start < 0 || end < 0 || years <= 0) {
                    showError(cagrError, '计算年化收益率时，数值不能为负，且结束年月必须晚于起始年月');
                    return;
                }

                const annualizedReturn = (Math.pow(end / start, 1 / years) - 1) * 100;
                cagrAnnualValue.textContent = `${annualizedReturn.toFixed(2)}%`;
                setReturnColor(cagrAnnualValue, annualizedReturn);
                cagrAnnualItem.style.display = '';
                cagrDetailInfo.textContent = `从 ${start} 增长至 ${end}，周期：${periodText}`;
            } else {
                cagrAnnualItem.style.display = 'none';
                cagrDetailInfo.textContent = `从 ${start} 变化至 ${end}`;
            }

            cagrResult.classList.add('show');
        }

        // ai coding: 根据指针位置驱动按钮高光与轻微三维倾斜 2026/09/11: 14:33
        const motionButtons = document.querySelectorAll('.btn-primary, .btn-clear');
        const supportsPointerMotion = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        if (supportsPointerMotion) {
            motionButtons.forEach(button => {
                button.addEventListener('pointermove', event => {
                    const bounds = button.getBoundingClientRect();
                    const xRatio = (event.clientX - bounds.left) / bounds.width;
                    const yRatio = (event.clientY - bounds.top) / bounds.height;

                    button.style.setProperty('--pointer-x', `${xRatio * 100}%`);
                    button.style.setProperty('--pointer-y', `${yRatio * 100}%`);
                    button.style.setProperty('--rotate-x', `${(0.5 - yRatio) * 5}deg`);
                    button.style.setProperty('--rotate-y', `${(xRatio - 0.5) * 7}deg`);
                });

                button.addEventListener('pointerleave', () => {
                    button.style.setProperty('--pointer-x', '50%');
                    button.style.setProperty('--pointer-y', '50%');
                    button.style.setProperty('--rotate-x', '0deg');
                    button.style.setProperty('--rotate-y', '0deg');
                });
            });
        }

        cagrInput.addEventListener('input', calculateCAGR);
        cagrInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') calculateCAGR();
        });

        document.getElementById('cagr-clear').addEventListener('click', () => {
            cagrInput.value = '';
            cagrError.classList.remove('show');
            cagrResult.classList.remove('show');
            cagrInput.focus();
        });
    </script>
</body>
</html>
